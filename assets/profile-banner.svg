    <text x="60" y="239" fill="#cbd5e1" font-size="23">From interface to API to database.</text>
    <text x="60" y="304" fill="#94a3b8" font-size="17" letter-spacing="1">C#  /  ASP.NET CORE  /  ANGULAR  /  REACT  /  SQL SERVER</text>
