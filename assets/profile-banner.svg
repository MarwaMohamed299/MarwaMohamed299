<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Marwa Ghonem — Full Stack .NET Developer</title>
  <desc id="desc">A navy and violet banner connecting frontend interfaces, backend APIs, and databases.</desc>
  <defs>
